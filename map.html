/* ===== 太陽位置（index.htmlと同一のNOAA式） ===== */
function solarPosition(lat, lon, date) {
  const rad = Math.PI / 180;
  let y = date.getUTCFullYear(), m = date.getUTCMonth() + 1;
  const d = date.getUTCDate() + (date.getUTCHours() + date.getUTCMinutes()/60 + date.getUTCSeconds()/3600) / 24;
  if (m <= 2) { y -= 1; m += 12; }
  const a = Math.floor(y / 100), b = 2 - a + Math.floor(a / 4);
  const jd = Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + b - 1524.5;
  const t = (jd - 2451545.0) / 36525.0;
  const l0 = (280.46646 + t * (36000.76983 + 0.0003032 * t)) % 360;
  const ma = 357.52911 + t * (35999.05029 - 0.0001537 * t);
  const mr = ma * rad;
  const c = Math.sin(mr) * (1.914602 - t * (0.004817 + 0.000014 * t))
          + Math.sin(2*mr) * (0.019993 - 0.000101 * t) + Math.sin(3*mr) * 0.000289;
  const omega = 125.04 - 1934.136 * t;
  const appLong = l0 + c - 0.00569 - 0.00478 * Math.sin(omega * rad);
  const e0 = 23 + (26 + (21.448 - t * (46.815 + t * (0.00059 - t * 0.001813))) / 60) / 60;
  const eps = e0 + 0.00256 * Math.cos(omega * rad);
  const decl = Math.asin(Math.sin(eps*rad) * Math.sin(appLong*rad)) / rad;
  const varY = Math.tan((eps/2)*rad) ** 2;
  const ecc = 0.016708634 - t * (0.000042037 + 0.0000001267 * t);
  const l0r = l0 * rad;
  const eqtime = 4 / rad * (varY*Math.sin(2*l0r) - 2*ecc*Math.sin(mr)
    + 4*ecc*varY*Math.sin(mr)*Math.cos(2*l0r) - 0.5*varY*varY*Math.sin(4*l0r) - 1.25*ecc*ecc*Math.sin(2*mr));
  const minutes = date.getUTCHours()*60 + date.getUTCMinutes() + date.getUTCSeconds()/60;
  const tst = (((minutes + eqtime + 4*lon) % 1440) + 1440) % 1440;
  let ha = tst/4 - 180;
  if (ha < -180) ha += 360;
  const latr = lat*rad, declr = decl*rad, har = ha*rad;
  const sinAlt = Math.sin(latr)*Math.sin(declr) + Math.cos(latr)*Math.cos(declr)*Math.cos(har);
  const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt))) / rad;
  const cosAz = (Math.sin(declr) - Math.sin(latr)*sinAlt) / (Math.cos(latr)*Math.cos(alt*rad));
  let az = Math.acos(Math.max(-1, Math.min(1, cosAz))) / rad;
  if (ha > 0) az = 360 - az;
  return { alt, az };
}

const DIRS = ["北","北北東","北東","東北東","東","東南東","南東","南南東","南","南南西","南西","西南西","西","西北西","北西","北北西"];
const dirName = deg => DIRS[Math.floor(((deg + 11.25) % 360) / 22.5)];
const clearsky = alt => alt <= 0 ? 0 : 1000 * Math.sin(alt * Math.PI/180) * 0.75;

/* 2地点間の距離(km)と方位(度) */
function distBearing(lat1, lon1, lat2, lon2) {
  const rad = Math.PI/180, R = 6371;
  const dLat = (lat2-lat1)*rad, dLon = (lon2-lon1)*rad;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
  const dist = 2*R*Math.asin(Math.sqrt(a));
  const yv = Math.sin(dLon)*Math.cos(lat2*rad);
  const xv = Math.cos(lat1*rad)*Math.sin(lat2*rad) - Math.sin(lat1*rad)*Math.cos(lat2*rad)*Math.cos(dLon);
  const brg = (Math.atan2(yv, xv)/rad + 360) % 360;
  return { dist, brg };
}

/* ===== 気象データ一括取得（Open-Meteo: 全地点を1リクエスト） ===== */
async function fetchAll() {
  const lats = POINTS.map(p => p[1].toFixed(2)).join(",");
  const lons = POINTS.map(p => p[2].toFixed(2)).join(",");
  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lats + "&longitude=" + lons
    + "&current=precipitation,shortwave_radiation,cloud_cover&timezone=Asia%2FTokyo";
  const res = await fetch(url);
  if (!res.ok) throw new Error("気象API エラー: " + res.status);
  const json = await res.json();
  return Array.isArray(json) ? json : [json];
}

/* ===== 各地点の虹スコア ===== */
function scoreAll(weather) {
  const now = new Date();
  const pts = POINTS.map((p, i) => {
    const cur = weather[i].current;
    const { alt, az } = solarPosition(p[1], p[2], now);
    return {
      name: p[0], lat: p[1], lon: p[2],
      precip: cur.precipitation ?? 0,
      radiation: cur.shortwave_radiation ?? 0,
      cloud: cur.cloud_cover ?? 100,
      sunAlt: alt, anti: (az + 180) % 360,
      score: 0, reason: ""
    };
  });

  for (const pt of pts) {
    if (pt.sunAlt <= 0) { pt.reason = "夜"; continue; }
    if (pt.sunAlt > 42) { pt.reason = "太陽が高すぎ"; continue; }
    const altFactor = 1.0 - (pt.sunAlt / 42) * 0.3;
    const sunFactor = Math.min(pt.radiation / Math.max(clearsky(pt.sunAlt) * 0.5, 1), 1.0);
    if (sunFactor < 0.3) { pt.reason = "日差し不足"; continue; }

    // 雨: 自地点 + 対日点方向±45度・90km以内の地点の降水
    let rain = pt.precip;
    for (const other of pts) {
      if (other === pt) continue;
      const { dist, brg } = distBearing(pt.lat, pt.lon, other.lat, other.lon);
      if (dist > 90) continue;
      let dAz = Math.abs(brg - pt.anti); if (dAz > 180) dAz = 360 - dAz;
      if (dAz <= 45) rain = Math.max(rain, other.precip * (1 - dist / 120));
    }
    if (rain <= 0) { pt.reason = "雨なし"; continue; }
    const rainFactor = Math.min(rain / 2.0, 1.0);
    pt.score = Math.min(Math.round(100 * altFactor * rainFactor * sunFactor), 100);
    pt.reason = "条件成立";
  }
  return pts;
}

/* ===== 地図描画 ===== */
const map = L.map("map", { zoomControl: false }).setView([37.5, 137.0], 5);
L.control.zoom({ position: "bottomright" }).addTo(map);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 12
}).addTo(map);

const legend = L.control({ position: "bottomleft" });
legend.onAdd = () => {
  const div = L.DomUtil.create("div", "legend");
  div.innerHTML =
    '<span class="dot" style="background:#ffd166"></span>虹チャンス！(60+)<br>' +
    '<span class="dot" style="background:#a78bfa"></span>もしかすると (40-59)<br>' +
    '<span class="dot" style="background:#5b8dd6"></span>条件一部あり (1-39)<br>' +
    '<span class="dot" style="background:#3a4a6a"></span>条件なし';
  return div;
};
legend.addTo(map);

let layer = L.layerGroup().addTo(map);

function color(s) {
  if (s >= 60) return "#ffd166";
  if (s >= 40) return "#a78bfa";
  if (s >= 1)  return "#5b8dd6";
  return "#3a4a6a";
}

function render(pts) {
  layer.clearLayers();
  let best = null;
  for (const pt of pts.slice().sort((a,b) => a.score - b.score)) {
    const c = color(pt.score);
    const m = L.circleMarker([pt.lat, pt.lon], {
      radius: pt.score >= 60 ? 11 : pt.score >= 40 ? 8 : 5,
      color: c, weight: pt.score >= 40 ? 2.5 : 1,
      fillColor: c, fillOpacity: pt.score >= 1 ? .85 : .45
    });
    const xQuery = encodeURIComponent("虹 " + pt.name);
    m.bindPopup(
      `<b>${pt.score >= 60 ? "🌈 " : ""}${pt.name}</b> — スコア ${pt.score}<br>` +
      (pt.score > 0
        ? `見る方角: <b>${dirName(pt.anti)}</b>（太陽を背に）<br>`
        : `${pt.reason}<br>`) +
      `降水 ${pt.precip.toFixed(1)}mm / 日射 ${Math.round(pt.radiation)}W/m² / 雲 ${pt.cloud}%<br>` +
      `太陽高度 ${pt.sunAlt.toFixed(0)}度<br>` +
      `<div style="margin-top:7px;border-top:1px solid rgba(255,255,255,.2);padding-top:7px;line-height:2">` +
      `<a href="https://x.com/search?q=${xQuery}&f=live" target="_blank" rel="noopener">𝕏 「虹 ${pt.name}」の投稿を見る</a><br>` +
      `<a href="https://www.windy.com/-Webcams/webcams?${pt.lat},${pt.lon},10" target="_blank" rel="noopener">📷 周辺のライブカメラ</a></div>`
    );
    m.addTo(layer);
    if (!best || pt.score > best.score) best = pt;
  }
  return best;
}

async function refresh() {
  const status = document.getElementById("status");
  status.textContent = "全国の空を解析中… 🌈";
  try {
    const weather = await fetchAll();
    const pts = scoreAll(weather);
    const best = render(pts);
    const hot = pts.filter(p => p.score >= 60).length;
    const maybe = pts.filter(p => p.score >= 40 && p.score < 60).length;
    const allNight = pts.every(p => p.sunAlt <= 0);
    const t = new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
    if (allNight) {
      status.textContent = `🌙 いまは日本全国が夜。虹は明日のお楽しみ（${t} 更新）`;
    } else if (hot > 0) {
      status.innerHTML = `🌈 <b>${hot}地点で虹チャンス発生中！</b> 最高: ${best.name} ${best.score}点（${t} 更新・10分ごと自動更新）`;
    } else if (maybe > 0) {
      status.textContent = `🌤 ${maybe}地点で「もしかすると」レベル。最高: ${best.name} ${best.score}点（${t} 更新・10分ごと自動更新）`;
    } else {
      status.textContent = `☁️ いま虹の条件が揃っている地点はありません（${t} 更新・10分ごと自動更新）`;
    }
  } catch (e) {
    status.textContent = "⚠️ データ取得に失敗しました: " + e.message;
  }
}

/* ===== ひまわり衛星画像オーバーレイ（気象庁・無料） ===== */
let satLayer = null, satOn = false;

async function toggleSat() {
  const btn = document.getElementById("satBtn");
  if (satOn) {
    if (satLayer) map.removeLayer(satLayer);
    satOn = false;
    btn.classList.remove("on");
    return;
  }
  try {
    btn.textContent = "🛰 取得中…";
    const res = await fetch("https://www.jma.go.jp/bosai/himawari/data/satimg/targetTimes_fd.json");
    const times = await res.json();
    const latest = times[times.length - 1];
    // 日中はトゥルーカラー、夜は赤外（雲が見える）を自動選択
    const tokyoSun = solarPosition(35.69, 139.69, new Date());
    const band = tokyoSun.alt > -5 ? "REP/ETC" : "B13/TBB";
    const url = `https://www.jma.go.jp/bosai/himawari/data/satimg/${latest.basetime}/fd/${latest.validtime}/${band}/{z}/{x}/{y}.jpg`;
    if (satLayer) map.removeLayer(satLayer);
    satLayer = L.tileLayer(url, {
      attribution: "衛星画像: 気象庁（ひまわり）",
      opacity: 0.62, maxNativeZoom: 5, maxZoom: 12
    }).addTo(map);
    satOn = true;
    btn.classList.add("on");
    // 観測時刻（UTC→JST）をボタンに表示
    const b = latest.basetime;
    const utc = new Date(Date.UTC(+b.slice(0,4), +b.slice(4,6)-1, +b.slice(6,8), +b.slice(8,10), +b.slice(10,12)));
    btn.textContent = "🛰 " + utc.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" }) + " 観測";
  } catch (e) {
    btn.textContent = "🛰 衛星";
    alert("衛星画像の取得に失敗しました: " + e.message);
  }
}

refresh();
setInterval(refresh, 10 * 60 * 1000);
</script>
