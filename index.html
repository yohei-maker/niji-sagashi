<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a2a4a">
<title>🌈 虹さがし</title>
<style>
  :root {
    --ink: #ffffff;
    --ink-dim: rgba(255,255,255,.72);
    --card: rgba(255,255,255,.10);
    --card-line: rgba(255,255,255,.16);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background: linear-gradient(170deg, #1a2a4a 0%, #2a4a7a 45%, #c97b4a 100%);
    background-attachment: fixed;
    padding: max(16px, env(safe-area-inset-top)) 16px 32px;
  }
  .wrap { max-width: 430px; margin: 0 auto; }
  header { text-align:center; padding: 8px 0 18px; }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: .04em; }
  header p { font-size: 12px; color: var(--ink-dim); margin-top: 4px; }

  .card {
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 14px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  /* スコアリング */
  .score-wrap { display:flex; flex-direction:column; align-items:center; padding: 22px 18px; }
  .ring { position: relative; width: 168px; height: 168px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .track { stroke: rgba(255,255,255,.15); }
  .ring .bar {
    stroke: url(#grad);
    stroke-linecap: round;
    transition: stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1);
  }
  .ring .num {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .ring .num b { font-size: 44px; font-weight: 800; line-height: 1; }
  .ring .num span { font-size: 11px; color: var(--ink-dim); margin-top: 4px; }
  .verdict { margin-top: 14px; font-size: 17px; font-weight: 700; text-align:center; }
  .reason { margin-top: 6px; font-size: 12px; color: var(--ink-dim); text-align:center; line-height: 1.6; }

  /* コンパス */
  .compass-card { display:flex; align-items:center; gap: 16px; }
  .compass { width: 120px; height: 120px; flex: none; }
  .compass-info h3 { font-size: 13px; color: var(--ink-dim); font-weight: 600; }
  .compass-info .dir { font-size: 30px; font-weight: 800; margin: 2px 0; }
  .compass-info .deg { font-size: 12px; color: var(--ink-dim); }

  /* 詳細グリッド */
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cell { background: rgba(0,0,0,.14); border-radius: 14px; padding: 12px 14px; }
  .cell .k { font-size: 11px; color: var(--ink-dim); }
  .cell .v { font-size: 18px; font-weight: 700; margin-top: 3px; }
  .cell .v small { font-size: 11px; font-weight: 400; color: var(--ink-dim); }

  /* 今日のチャンス */
  h2 { font-size: 14px; font-weight: 700; margin: 4px 0 10px; }
  .slot { display:flex; align-items:center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid rgba(255,255,255,.10); }
  .slot:last-child { border-bottom: none; }
  .slot .t { font-size: 16px; font-weight: 700; width: 56px; }
  .slot .info { flex:1; font-size: 12px; color: var(--ink-dim); line-height: 1.5; }
  .slot .d { font-size: 14px; font-weight: 700; }
  .empty { font-size: 13px; color: var(--ink-dim); text-align:center; padding: 12px 0; line-height: 1.7; }

  .foot { text-align:center; font-size: 11px; color: var(--ink-dim); margin-top: 6px; line-height: 1.8; }
  .reload {
    display:block; width:100%; padding: 14px; margin-top: 4px;
    border: 1px solid var(--card-line); border-radius: 16px;
    background: rgba(255,255,255,.14); color: var(--ink);
    font-size: 15px; font-weight: 700; cursor: pointer;
    text-align: center; text-decoration: none; box-sizing: border-box;
    font-family: inherit;
  }
  .reload:active { background: rgba(255,255,255,.26); }
  .loading { text-align:center; padding: 60px 0; font-size: 14px; color: var(--ink-dim); }
  .spin { display:inline-block; animation: spin 1.6s linear infinite; font-size: 28px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌈 虹さがし</h1>
    <p>天気を、体験に変える。</p>
  </header>

  <div id="loading" class="loading"><span class="spin">🌈</span><br><br>空を解析中…</div>

  <div id="main" class="hidden">

    <div class="card score-wrap">
      <div class="ring">
        <svg width="168" height="168" viewBox="0 0 168 168">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#7ec8ff"/>
              <stop offset="50%" stop-color="#a78bfa"/>
              <stop offset="100%" stop-color="#fca5a5"/>
            </linearGradient>
          </defs>
          <circle class="track" cx="84" cy="84" r="74" fill="none" stroke-width="12"/>
          <circle id="bar" class="bar" cx="84" cy="84" r="74" fill="none" stroke-width="12"
                  stroke-dasharray="465" stroke-dashoffset="465"/>
        </svg>
        <div class="num"><b id="score">0</b><span>虹チャンス</span></div>
      </div>
      <div class="verdict" id="verdict">—</div>
      <div class="reason" id="reason"></div>
    </div>

    <div class="card compass-card" id="compassCard">
      <svg class="compass" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="56" fill="rgba(0,0,0,.15)" stroke="rgba(255,255,255,.25)"/>
        <text x="60" y="16" text-anchor="middle" fill="rgba(255,255,255,.85)" font-size="11" font-weight="700">N</text>
        <text x="108" y="64" text-anchor="middle" fill="rgba(255,255,255,.5)" font-size="10">E</text>
        <text x="60" y="112" text-anchor="middle" fill="rgba(255,255,255,.5)" font-size="10">S</text>
        <text x="12" y="64" text-anchor="middle" fill="rgba(255,255,255,.5)" font-size="10">W</text>
        <g id="needle" transform="rotate(0 60 60)">
          <path d="M60 22 L67 58 L60 52 L53 58 Z" fill="#ffd166"/>
          <circle cx="60" cy="60" r="4" fill="#ffd166"/>
        </g>
        <g id="sunDot" transform="rotate(0 60 60)">
          <circle cx="60" cy="98" r="5" fill="#ff9f43" opacity=".9"/>
        </g>
      </svg>
      <div class="compass-info">
        <h3>虹が出る方向（太陽を背に）</h3>
        <div class="dir" id="dirName">—</div>
        <div class="deg" id="dirDeg">— / 🟠は太陽の方向</div>
      </div>
    </div>

    <div class="card">
      <div class="grid">
        <div class="cell"><div class="k">☀️ 太陽高度</div><div class="v" id="sunAlt">—<small> 度</small></div></div>
        <div class="cell"><div class="k">🌧 虹方向の降水</div><div class="v" id="rainDir">—<small> mm/h</small></div></div>
        <div class="cell"><div class="k">💡 日射量</div><div class="v" id="rad">—<small> W/m²</small></div></div>
        <div class="cell"><div class="k">☁️ 雲量</div><div class="v" id="cloud">—<small> %</small></div></div>
      </div>
    </div>

    <div class="card">
      <h2>📅 今日のチャンス時間帯</h2>
      <div id="slots"></div>
    </div>

    <button class="reload" onclick="run()">🔄 もう一度空をチェック</button>
    <a class="reload" style="margin-top:10px" href="map.html">🗾 全国の虹マップを見る</a>
    <a class="reload" style="margin-top:10px" href="https://x.com/search?q=%E8%99%B9&f=live" target="_blank" rel="noopener">𝕏 みんなの「虹」投稿を見る</a>
    <div class="foot" id="foot"></div>
  </div>
</div>

<script>
"use strict";

/* ===== 太陽位置（NOAA式・rainbow_check.py からの移植） ===== */
function solarPosition(lat, lon, date) {
  const rad = Math.PI / 180;
  let y = date.getUTCFullYear(), m = date.getUTCMonth() + 1;
  const d = date.getUTCDate() + (date.getUTCHours() + date.getUTCMinutes()/60 + date.getUTCSeconds()/3600) / 24;
  if (m <= 2) { y -= 1; m += 12; }
  const a = Math.floor(y / 100), b = 2 - a + Math.floor(a / 4);
  const jd = Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + b - 1524.5;
  const t = (jd - 2451545.0) / 36525.0;

  const l0 = (280.46646 + t * (36000.76983 + 0.0003032 * t)) % 360;
  const ma = 357.52911 + t * (35999.05029 - 0.0001537 * t);
  const mr = ma * rad;
  const c = Math.sin(mr) * (1.914602 - t * (0.004817 + 0.000014 * t))
          + Math.sin(2*mr) * (0.019993 - 0.000101 * t)
          + Math.sin(3*mr) * 0.000289;
  const trueLong = l0 + c;
  const omega = 125.04 - 1934.136 * t;
  const appLong = trueLong - 0.00569 - 0.00478 * Math.sin(omega * rad);
  const e0 = 23 + (26 + (21.448 - t * (46.815 + t * (0.00059 - t * 0.001813))) / 60) / 60;
  const eps = e0 + 0.00256 * Math.cos(omega * rad);
  const decl = Math.asin(Math.sin(eps*rad) * Math.sin(appLong*rad)) / rad;

  const varY = Math.tan((eps/2)*rad) ** 2;
  const ecc = 0.016708634 - t * (0.000042037 + 0.0000001267 * t);
  const l0r = l0 * rad;
  const eqtime = 4 / rad * (
    varY * Math.sin(2*l0r) - 2*ecc*Math.sin(mr)
    + 4*ecc*varY*Math.sin(mr)*Math.cos(2*l0r)
    - 0.5*varY*varY*Math.sin(4*l0r) - 1.25*ecc*ecc*Math.sin(2*mr));

  const minutes = date.getUTCHours()*60 + date.getUTCMinutes() + date.getUTCSeconds()/60;
  const tst = (((minutes + eqtime + 4*lon) % 1440) + 1440) % 1440;
  let ha = tst/4 - 180;
  if (ha < -180) ha += 360;

  const latr = lat*rad, declr = decl*rad, har = ha*rad;
  const sinAlt = Math.sin(latr)*Math.sin(declr) + Math.cos(latr)*Math.cos(declr)*Math.cos(har);
  const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt))) / rad;
  const cosAz = (Math.sin(declr) - Math.sin(latr)*sinAlt) / (Math.cos(latr)*Math.cos(alt*rad));
  let az = Math.acos(Math.max(-1, Math.min(1, cosAz))) / rad;
  if (ha > 0) az = 360 - az;
  return { alt, az };
}

function offsetPoint(lat, lon, bearing, distKm) {
  const R = 6371, rad = Math.PI/180;
  const br = bearing*rad, la1 = lat*rad, lo1 = lon*rad;
  const la2 = Math.asin(Math.sin(la1)*Math.cos(distKm/R) + Math.cos(la1)*Math.sin(distKm/R)*Math.cos(br));
  const lo2 = lo1 + Math.atan2(Math.sin(br)*Math.sin(distKm/R)*Math.cos(la1),
                               Math.cos(distKm/R) - Math.sin(la1)*Math.sin(la2));
  return [la2/rad, lo2/rad];
}

const DIRS = ["北","北北東","北東","東北東","東","東南東","南東","南南東","南","南南西","南西","西南西","西","西北西","北西","北北西"];
const dirName = deg => DIRS[Math.floor(((deg + 11.25) % 360) / 22.5)];
const clearsky = alt => alt <= 0 ? 0 : 1000 * Math.sin(alt * Math.PI/180) * 0.75;

/* ===== 気象データ取得（Open-Meteo / 4地点を1回のリクエストで） ===== */
async function fetchWeather(points) {
  const lats = points.map(p => p[0].toFixed(4)).join(",");
  const lons = points.map(p => p[1].toFixed(4)).join(",");
  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lats + "&longitude=" + lons
    + "&minutely_15=precipitation,shortwave_radiation"
    + "&hourly=cloud_cover,precipitation&forecast_days=1&timezone=auto";
  const res = await fetch(url);
  if (!res.ok) throw new Error(res.status === 429 ? "RATE_LIMIT" : "気象API エラー: " + res.status);
  const json = await res.json();
  return Array.isArray(json) ? json : [json];
}

/* APIレート制限対策: 取得結果を保存して開き直し時に再利用 */
const CACHE_KEY = "niji_here_cache_v1";

function saveCache(loc, data) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), lat: loc.lat, lon: loc.lon, data })); } catch (e) {}
}

function loadCache(loc, maxAgeMin) {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (c && Date.now() - c.t < maxAgeMin * 60 * 1000
        && Math.abs(c.lat - loc.lat) < 0.05 && Math.abs(c.lon - loc.lon) < 0.05) return c;
  } catch (e) {}
  return null;
}

function valueAtNow(block, key) {
  const now = new Date();
  let best = 0, bestDiff = Infinity;
  block.time.forEach((ts, i) => {
    const diff = Math.abs(new Date(ts) - now);
    if (diff < bestDiff) { bestDiff = diff; best = i; }
  });
  return block[key][best] ?? 0;
}

/* ===== スコア判定 ===== */
function judge(lat, lon, here, dirData) {
  const { alt, az } = solarPosition(lat, lon, new Date());
  const anti = (az + 180) % 360;
  const r = { sunAlt: alt, sunAz: az, anti, rainDir: 0, radiation: 0, cloud: null, score: 0, reason: "" };

  r.radiation = valueAtNow(here.minutely_15, "shortwave_radiation");
  r.cloud = valueAtNow(here.hourly, "cloud_cover");

  if (alt <= 0) { r.reason = "いまは夜。虹は太陽が出ている時間のお楽しみ"; return r; }
  if (alt > 42) { r.reason = "太陽が高すぎる時間帯（42度超）。虹は朝と夕方の現象です"; return r; }
  const altFactor = 1.0 - (alt / 42) * 0.3;

  const cs = clearsky(alt);
  const sunFactor = Math.min(r.radiation / Math.max(cs * 0.5, 1), 1.0);

  const rains = dirData.map(d => valueAtNow(d.minutely_15, "precipitation"));
  const rainHere = valueAtNow(here.minutely_15, "precipitation");
  r.rainDir = Math.max(...rains, rainHere * 0.5);

  if (r.rainDir <= 0) { r.reason = dirName(anti) + "の空に雨がありません。雨上がりを待ちましょう"; return r; }
  if (sunFactor < 0.3) { r.reason = "雨はあるけれど日差しが足りません。太陽が顔を出したらチャンス"; return r; }

  const rainFactor = Math.min(r.rainDir / 2.0, 1.0);
  r.score = Math.min(Math.round(100 * altFactor * rainFactor * sunFactor), 100);
  r.reason = "条件が揃っています！" + dirName(anti) + "の空を見上げてみて";
  return r;
}

/* ===== 今日のチャンス時間帯 ===== */
function todaySlots(lat, lon, here) {
  const out = [];
  const h = here.hourly;
  for (let i = 0; i < h.time.length; i++) {
    const tLocal = new Date(h.time[i]);
    if (tLocal < new Date()) continue;
    // Open-Meteoのtimeは観測地ローカル表記 → utc_offset_secondsを引いてUTCへ
    const sp = solarPosition(lat, lon, new Date(Date.UTC(
      tLocal.getFullYear(), tLocal.getMonth(), tLocal.getDate(),
      tLocal.getHours(), tLocal.getMinutes()) - here.utc_offset_seconds * 1000));
    const p = h.precipitation[i] ?? 0, c = h.cloud_cover[i] ?? 100;
    if (sp.alt > 0 && sp.alt <= 42 && p > 0) {
      out.push({
        time: h.time[i].slice(11, 16),
        alt: sp.alt, anti: (sp.az + 180) % 360,
        precip: p, cloud: c, good: c < 80
      });
    }
  }
  return out;
}

/* ===== 位置情報 ===== */
function getLocation() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve({ lat: 35.1815, lon: 136.9060, src: "既定(名古屋)" });
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, src: "現在地" }),
      ()  => resolve({ lat: 35.1815, lon: 136.9060, src: "既定(名古屋)" }),
      { timeout: 8000, maximumAge: 600000 }
    );
  });
}

/* ===== 画面更新 ===== */
async function run() {
  document.getElementById("loading").classList.remove("hidden");
  document.getElementById("main").classList.add("hidden");
  try {
    const loc = await getLocation();
    const sun = solarPosition(loc.lat, loc.lon, new Date());
    const anti = (sun.az + 180) % 360;
    const pts = [[loc.lat, loc.lon], offsetPoint(loc.lat, loc.lon, anti, 5),
                 offsetPoint(loc.lat, loc.lon, anti, 15), offsetPoint(loc.lat, loc.lon, anti, 30)];
    let data, cacheNote = "";
    const fresh = loadCache(loc, 5);
    if (fresh) {
      data = fresh.data;  // 5分以内に取得済みならAPIを叩かない
    } else {
      try {
        data = await fetchWeather(pts);
        saveCache(loc, data);
      } catch (e) {
        const old = loadCache(loc, 60);
        if (!old) {
          if (e.message === "RATE_LIMIT") {
            document.getElementById("loading").innerHTML =
              "⏳ アクセスが集中しています<br><br>60秒後に自動で再試行します…";
            setTimeout(run, 60 * 1000);
            return;
          }
          throw e;
        }
        data = old.data;
        cacheNote = "・保存データ表示中";
      }
    }
    const here = data[0], dirData = data.slice(1);
    const r = judge(loc.lat, loc.lon, here, dirData);

    // スコアリング
    document.getElementById("score").textContent = r.score;
    document.getElementById("bar").style.strokeDashoffset = 465 - 465 * (r.score / 100);
    const verdict = r.score >= 60 ? "🌈 虹チャンス！外に出よう"
                  : r.score >= 40 ? "🌤 もしかすると…空を気にしてみて"
                  : "☁️ いまは虹の条件が揃っていません";
    document.getElementById("verdict").textContent = verdict;
    document.getElementById("reason").textContent = r.reason;

    // コンパス
    document.getElementById("needle").setAttribute("transform", `rotate(${r.anti} 60 60)`);
    document.getElementById("sunDot").setAttribute("transform", `rotate(${r.sunAz - 180} 60 60)`);
    document.getElementById("dirName").textContent = dirName(r.anti);
    document.getElementById("dirDeg").textContent = Math.round(r.anti) + "度 / 🟠は太陽の方向";

    // 詳細
    document.getElementById("sunAlt").innerHTML = r.sunAlt.toFixed(1) + "<small> 度</small>";
    document.getElementById("rainDir").innerHTML = r.rainDir.toFixed(1) + "<small> mm/h</small>";
    document.getElementById("rad").innerHTML = Math.round(r.radiation) + "<small> W/m²</small>";
    document.getElementById("cloud").innerHTML = (r.cloud ?? "—") + "<small> %</small>";

    // 今日のチャンス
    const slots = todaySlots(loc.lat, loc.lon, here);
    const el = document.getElementById("slots");
    el.innerHTML = slots.length === 0
      ? '<div class="empty">今日はこのあと条件が重なる時間帯はなさそうです。<br>雨上がりの朝・夕方が狙い目です 🌦→🌈</div>'
      : slots.map(s =>
          `<div class="slot"><div class="t">${s.time}</div>
           <div class="info">${s.good ? "◎" : "△ 雲多め"} 降水${s.precip.toFixed(1)}mm / 雲量${s.cloud}% / 太陽高度${s.alt.toFixed(0)}度</div>
           <div class="d">${dirName(s.anti)}</div></div>`).join("");

    document.getElementById("foot").textContent =
      `📍 ${loc.src} (${loc.lat.toFixed(2)}, ${loc.lon.toFixed(2)}) ・ ${new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})} 更新${cacheNote} ・ データ: Open-Meteo`;

    document.getElementById("loading").classList.add("hidden");
    document.getElementById("main").classList.remove("hidden");
  } catch (e) {
    document.getElementById("loading").innerHTML = "⚠️ データ取得に失敗しました<br><br>" + e.message
      + '<br><br><button class="reload" onclick="run()">再試行</button>';
  }
}
run();
</script>
</body>
</html>
